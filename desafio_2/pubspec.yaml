name: desafio_2
description: "CRUD de itens com formulário, validação, ListView e SQLite."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # Banco SQLite nativo no Android/iOS.
  sqflite: ^2.4.2
  # Pasta de documentos do app — onde as imagens copiadas ficam.
  path_provider: ^2.1.5
  # Seletor de imagem da galeria do aparelho.
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

